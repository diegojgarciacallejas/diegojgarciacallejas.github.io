<style>
  html, body { margin: 0; min-height: 100%; background: #0f0a1e; overflow: hidden; }
  /* en el móvil es un juego, no una página: sin zoom por doble toque, sin selección azul y sin menú al mantener pulsado */
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #game, #game canvas { touch-action: none; }
  body.zoomed { overflow: auto; }
  #game { margin: 0 auto; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  /* visor de proyectos (js/viewer.js): la página del proyecto encima del juego */
  #viewer { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; background: #0f0a1e; }
  #viewer[hidden] { display: none; }
  #viewer .vbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 12px; background: #120c22; border-bottom: 3px solid #4b3677; }
  #viewer .vtitle { font: 400 20px/1 "Jersey 20", monospace; color: #a59fc0; letter-spacing: 1px; }
  #viewer .vclose { font: 400 18px/1 "Jersey 20", monospace; letter-spacing: 1px; text-transform: uppercase; color: #120b1c; background: #7cc59a;
    border: 3px solid #120b1c; padding: 6px 12px 5px; cursor: pointer; box-shadow: inset 3px 3px 0 rgba(255,255,255,.45), inset -3px -3px 0 #3f9a68; }
  #viewer .vclose:hover, #viewer .vclose:focus-visible { outline: 3px solid #f2c66d; outline-offset: 2px; }
  #viewer iframe { flex: 1; width: 100%; border: 0; background: #0f0a1e; }
  /* botones de arriba (js/hud.js) y panel de logros */
  #hud { position: fixed; top: 8px; right: 8px; z-index: 5; display: flex; gap: 6px; }
  #hud button { position: relative; display: flex; align-items: center; gap: 6px; height: 36px; min-width: 36px; padding: 0 7px; background: #1a1130; border: 3px solid #4b3677;
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.12), 3px 3px 0 rgba(0,0,0,.45); cursor: pointer; color: #f3eedc; font: 400 17px/1 "Jersey 20", monospace; }
  #hud button:hover, #hud button:focus-visible { border-color: #9c8ad6; outline: none; }
  #hud img { width: 20px; height: 20px; image-rendering: pixelated; }
  #hud button[aria-pressed="false"] img { opacity: .4; }
  #hud button[aria-pressed="false"]::after { content: ""; position: absolute; left: 7px; right: 7px; top: 50%; height: 3px; background: #d9665a; transform: rotate(-35deg); }
  .hcount { color: #f2c66d; }
  #hud .hlang { min-width: 44px; justify-content: center; color: #7cc59a; font-size: 20px; letter-spacing: 1px; }
  #rotate { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 4; padding: 8px 14px; background: #1a1130; border: 3px solid #4b3677; color: #f3eedc; font: 400 18px/1 "Jersey 20", monospace; letter-spacing: .5px; white-space: nowrap; }
  #rotate[hidden] { display: none; }
  @media (orientation: portrait) { #rotate { bottom: 196px; } }   /* por encima del mando */
  /* mando del móvil (js/pad.js): cruceta y botón A, estilo Game Boy */
  #pad { position: fixed; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 6; display: flex; justify-content: space-between; align-items: center;
    padding: 0 max(18px, env(safe-area-inset-left)) 0 max(18px, env(safe-area-inset-right)); pointer-events: none; user-select: none; -webkit-user-select: none; touch-action: none; }
  #pad .dpad, #pad .abtn { pointer-events: auto; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #pad .dpad { width: 138px; height: 138px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
  #pad .dpad i { background: #2b2537; border: 3px solid #120b1c; box-shadow: inset 3px 3px 0 rgba(255,255,255,.14), inset -3px -3px 0 rgba(0,0,0,.35); position: relative; }
  #pad .dpad i[data-k="up"] { grid-area: 1 / 2; border-bottom: 0; } #pad .dpad i[data-k="down"] { grid-area: 3 / 2; border-top: 0; }
  #pad .dpad i[data-k="left"] { grid-area: 2 / 1; border-right: 0; } #pad .dpad i[data-k="right"] { grid-area: 2 / 3; border-left: 0; }
  #pad .dpad i.mid { grid-area: 2 / 2; border-left: 0; border-right: 0; box-shadow: none; }
  #pad .dpad i[data-k]::after { content: ""; position: absolute; left: 50%; top: 50%; border: 8px solid transparent; transform: translate(-50%, -50%); }
  #pad .dpad i[data-k="up"]::after { border-bottom-color: #8f86a8; margin-top: -4px; } #pad .dpad i[data-k="down"]::after { border-top-color: #8f86a8; margin-top: 4px; }
  #pad .dpad i[data-k="left"]::after { border-right-color: #8f86a8; margin-left: -4px; } #pad .dpad i[data-k="right"]::after { border-left-color: #8f86a8; margin-left: 4px; }
  #pad .dpad i.on { background: #4b3677; }
  #pad .abtn { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #120b1c; background: #c0365b; color: #f3eedc; font: 700 30px/1 "Pixelify Sans", monospace;
    box-shadow: inset 4px 4px 0 rgba(255,255,255,.3), inset -4px -4px 0 rgba(0,0,0,.3), 3px 3px 0 rgba(0,0,0,.4); cursor: pointer; margin-right: 6px; }
  #pad .abtn.on { background: #8e2443; transform: translateY(2px); }
  /* en horizontal, sobre los bordes del juego: más pequeño y medio transparente */
  @media (orientation: landscape) { #pad { opacity: .72; } #pad .dpad { width: 118px; height: 118px; } #pad .abtn { width: 66px; height: 66px; font-size: 26px; } }
  .lpanel { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; padding: 16px; background: rgba(15,10,30,.78); }
  .lbox { width: min(760px, 100%); max-height: calc(100% - 8px); overflow: auto; padding: 22px 26px 16px; background: #140d26; border: 4px solid #9c8ad6; box-shadow: 8px 8px 0 rgba(0,0,0,.5); color: #f3eedc; }
  .lhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .ltitle { margin: 0; font: 400 38px/1 "Jersey 20", monospace; letter-spacing: 1px; color: #f2c66d; }   /* Jersey: sus números se leen mejor (en Pixelify el 5 parece una S) */
  .lclose { font: 400 21px/1 "Jersey 20", monospace; letter-spacing: 1.5px; text-transform: uppercase; padding: 7px 16px 6px; color: #120b1c; background: #b9b0d6; border: 3px solid #120b1c;
    box-shadow: inset 3px 3px 0 rgba(255,255,255,.5), inset -3px -3px 0 #8d7bb5; cursor: pointer; }
  .lclose:hover, .lclose:focus-visible { outline: 3px solid #f2c66d; outline-offset: 2px; }
  .lgrid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 560px) { .lgrid { grid-template-columns: minmax(0, 1fr); } .ltitle { font-size: 26px; } }
  .lgrid li { display: flex; gap: 14px; align-items: center; padding: 12px 14px; background: #1a1130; border: 3px solid #3a2a5c; }
  .lgrid li img { width: 34px; height: 34px; image-rendering: pixelated; flex: none; }
  .lgrid li b { display: block; font: 700 19px/1.15 "Pixelify Sans", monospace; color: #9c8ad6; }
  .lgrid li span { display: block; margin-top: 3px; font: 400 18px/1.15 "Jersey 20", monospace; letter-spacing: .4px; color: #8f80c0; }
  .lgrid li.got { border-color: #f2c66d; background: #1d1336; }
  .lgrid li.got b { color: #f3eedc; } .lgrid li.got span { color: #e4dfcf; }
  .litems { margin: 22px 0 10px; font: 400 30px/1 "Jersey 20", monospace; letter-spacing: 1px; color: #6aa6f0; }
  .lchips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-width: 40px; text-align: center; padding: 6px 12px 5px; font: 400 20px/1 "Jersey 20", monospace; letter-spacing: .5px; color: #6f5aa8; border: 3px dashed #4b3677; }
  .chip.got { color: #7cc59a; border: 3px solid #7cc59a; }
  .lreset { display: block; margin: 18px 0 0; padding: 0; background: none; border: 0; font: 500 14px/1 "Pixelify Sans", monospace; color: #6f5aa8; text-decoration: underline; cursor: pointer; }
  .lreset:hover, .lreset:focus-visible { color: #d9665a; outline: none; }
  noscript { color: #e9e4d4; font: 16px sans-serif; padding: 24px; display: block; }
</style>
